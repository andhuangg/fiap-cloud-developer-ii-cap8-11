# correcao 1: valor em base64 valido (ou, melhor, usar stringData e deixar o API server codificar)
apiVersion: v1
kind: Secret
metadata:
  name: db-secret-invalido
  namespace: store-dev
type: Opaque
stringData:
  DB_PASSWORD: "senha@123!"
---
# correcao 2: gerado com echo -n 'senha' | base64  (sem o \n)
apiVersion: v1
kind: Secret
metadata:
  name: db-secret-quebra
  namespace: store-dev
type: Opaque
data:
  DB_PASSWORD: c2VuaGE=
