apiVersion: batch/v1
kind: Job
metadata:
  name: relatorio-quebrado
  namespace: store-dev
spec:
  backoffLimit: 2              # 1 tentativa + 2 retentativas = 3 Pods
  template:
    spec:
      restartPolicy: Never     # cada retentativa cria um Pod NOVO
      containers:
        - name: relatorio
          image: busybox:1.36
          command: ["sh", "-c", "echo gerando relatorio; cat /dados/vendas.csv"]   # arquivo inexistente -> exit 1
