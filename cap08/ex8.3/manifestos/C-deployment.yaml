apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api
  namespace: store-dev
  labels: {app: store-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: store-api}
  template:
    metadata:
      labels: {app: store-api}
    spec:
      containers:
        - name: store-api
          image: store-api:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /ready, port: 8000}   # probe correta
            periodSeconds: 5
            failureThreshold: 2
