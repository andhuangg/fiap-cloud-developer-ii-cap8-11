apiVersion: batch/v1
kind: Job
metadata:
  name: processa-particoes
  namespace: store-dev
spec:
  completionMode: Indexed    # cada Pod recebe um indice unico (0..completions-1)
  completions: 4
  parallelism: 4
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "PARTICAO ${JOB_COMPLETION_INDEX} processada por $(hostname)"
