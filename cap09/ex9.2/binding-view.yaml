# (b) permissao concedida ao GRUPO fiap:qa (vem do O= do certificado), nao ao usuario
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qa-view
  namespace: store-dev
subjects:
  - kind: Group
    name: fiap:qa
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
