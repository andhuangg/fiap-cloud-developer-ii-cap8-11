# EXTRA OPCIONAL (ex 10.4): Knative Service equivalente a store-api de prod.
# O Knative cria sozinho: Revision (imutavel), Deployment, Service, Route e o autoscaler (KPA).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: store-api
  namespace: store-prod
  labels: {app: store-api, app.kubernetes.io/part-of: fiap-store}
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"     # escala a zero sem trafego (substitui replicas + HPA)
        autoscaling.knative.dev/max-scale: "20"
        autoscaling.knative.dev/target: "50"       # requisicoes concorrentes por Pod
    spec:
      containerConcurrency: 0
      timeoutSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - image: store-api:1.1
          ports: [{containerPort: 8000}]
          env:
            - {name: APP_ENV, value: prod}
          readinessProbe:
            httpGet: {path: /ready}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
