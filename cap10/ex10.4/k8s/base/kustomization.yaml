apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# manifestos comuns aos dois ambientes; diferencas ficam nos overlays
resources:
  - store-api.yaml
  - store-front.yaml
  - store-worker.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: fiap-store
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false        # nao mexe nos selectors (sao imutaveis)
