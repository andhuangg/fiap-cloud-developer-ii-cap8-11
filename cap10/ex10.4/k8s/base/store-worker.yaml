apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-worker
  labels: {app: store-worker}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector: {matchLabels: {app: store-worker}}
  template:
    metadata:
      labels: {app: store-worker}
    spec:
      serviceAccountName: store-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: store-worker
          image: busybox:1.36
          # worker didatico: trata SIGTERM (trap) para terminar o item atual e sair limpo
          command: ["sh", "-c"]
          args:
            - |
              trap 'echo "SIGTERM: finalizando item atual"; exit 0' TERM
              while true; do echo "$(date +%T) [$APP_ENV] processando fila de pedidos"; sleep 10 & wait $!; done
          envFrom:
            - configMapRef: {name: store-config}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
