apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-front
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-front
  labels: {app: store-front}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector: {matchLabels: {app: store-front}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: store-front}
    spec:
      serviceAccountName: store-front
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                     # usuario nginx da imagem unprivileged
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: store-front
          image: nginxinc/nginx-unprivileged:1.30-alpine-slim   # escuta na 8080, sem root (1.27-alpine barrada pelo make scan: 3 CRITICAL corrigiveis)
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}   # nginx-unprivileged grava pid e cache em /tmp
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: store-front
  labels: {app: store-front}
spec:
  selector: {app: store-front}
  ports: [{name: http, port: 80, targetPort: http}]
