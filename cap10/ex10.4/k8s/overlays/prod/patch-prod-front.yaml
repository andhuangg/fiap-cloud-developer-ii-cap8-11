apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-front
spec:
  template:
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: store-front
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          lifecycle:
            preStop:
              sleep: {seconds: 5}
