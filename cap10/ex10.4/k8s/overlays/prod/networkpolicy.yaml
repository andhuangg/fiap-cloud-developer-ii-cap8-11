# 1) default-deny: nada entra nem sai sem regra explicita
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 2) DNS liberado para todos (sem isso nada resolve nome)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# 3) store-front recebe trafego do ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-front
spec:
  podSelector:
    matchLabels: {app: store-front}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: store-api}
      ports: [{protocol: TCP, port: 8000}]
---
# 4) store-api so aceita store-front e store-worker (mesmo namespace) e o Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-api
spec:
  podSelector:
    matchLabels: {app: store-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: store-front}
        - podSelector:
            matchLabels: {app: store-worker}
      ports: [{protocol: TCP, port: 8000}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{protocol: TCP, port: 8000}]
---
# 5) store-worker pode chamar a store-api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker-to-api
spec:
  podSelector:
    matchLabels: {app: store-worker}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: store-api}
      ports: [{protocol: TCP, port: 8000}]
