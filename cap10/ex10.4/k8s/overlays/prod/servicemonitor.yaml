# requer o CRD monitoring.coreos.com (Prometheus Operator); ver alvo "prereqs" do Makefile
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: store-api
  labels: {release: prometheus}
spec:
  selector:
    matchLabels: {app: store-api}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
