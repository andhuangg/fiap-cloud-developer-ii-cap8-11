apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: store-dev
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs: {ambiente: dev}
    includeSelectors: false
# dev roda a versao candidata (1.2 = distroless + shutdown gracioso)
images:
  - name: store-api
    newTag: "1.2"
configMapGenerator:
  - name: store-config
    literals:
      - APP_ENV=dev
      - LOG_LEVEL=debug
replicas:
  - {name: store-api, count: 1}
  - {name: store-front, count: 1}
  - {name: store-worker, count: 1}
# recursos pequenos em dev (base ja e pequena; aqui so o limit de memoria da api)
patches:
  - target: {kind: Deployment, name: store-api}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 25m, memory: 48Mi}, limits: {memory: 96Mi}}
