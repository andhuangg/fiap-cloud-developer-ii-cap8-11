apiVersion: v1
kind: Namespace
metadata:
  name: store-dev
  labels:
    ambiente: dev
    # dev: baseline (bloqueia escaladas conhecidas, permite depurar com mais liberdade)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.33
    pod-security.kubernetes.io/warn: restricted     # avisa o que quebraria em prod
    pod-security.kubernetes.io/warn-version: v1.33
