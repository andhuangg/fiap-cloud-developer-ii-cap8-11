apiVersion: v1
kind: Namespace
metadata:
  labels:
    ambiente: dev
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.33
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.33
  name: store-dev
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    ambiente: dev
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: fiap-store
  name: store-api
  namespace: store-dev
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    ambiente: dev
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: fiap-store
  name: store-front
  namespace: store-dev
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    ambiente: dev
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: fiap-store
  name: store-worker
  namespace: store-dev
---
apiVersion: v1
data:
  APP_ENV: dev
  LOG_LEVEL: debug
kind: ConfigMap
metadata:
  labels:
    ambiente: dev
  name: store-config-h588hdc8kc
  namespace: store-dev
---
apiVersion: v1
kind: Service
metadata:
  labels:
    ambiente: dev
    app: store-api
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: fiap-store
  name: store-api
  namespace: store-dev
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: store-api
---
apiVersion: v1
kind: Service
metadata:
  labels:
    ambiente: dev
    app: store-front
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: fiap-store
  name: store-front
  namespace: store-dev
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: store-front
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    ambiente: dev
    app: store-api
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: fiap-store
  name: store-api
  namespace: store-dev
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: store-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: store-api
    spec:
      automountServiceAccountToken: false
      containers:
      - envFrom:
        - configMapRef:
            name: store-config-h588hdc8kc
        image: store-api:1.2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        name: store-api
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
        resources:
          limits:
            memory: 96Mi
          requests:
            cpu: 25m
            memory: 48Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: store-api
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    ambiente: dev
    app: store-front
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: fiap-store
  name: store-front
  namespace: store-dev
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: store-front
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: store-front
    spec:
      automountServiceAccountToken: false
      containers:
      - image: nginxinc/nginx-unprivileged:1.30-alpine-slim
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
        name: store-front
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 20m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: store-front
      volumes:
      - emptyDir:
          sizeLimit: 32Mi
        name: tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    ambiente: dev
    app: store-worker
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: fiap-store
  name: store-worker
  namespace: store-dev
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: store-worker
  template:
    metadata:
      labels:
        app: store-worker
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - |
          trap 'echo "SIGTERM: finalizando item atual"; exit 0' TERM
          while true; do echo "$(date +%T) [$APP_ENV] processando fila de pedidos"; sleep 10 & wait $!; done
        command:
        - sh
        - -c
        envFrom:
        - configMapRef:
            name: store-config-h588hdc8kc
        image: busybox:1.36
        name: store-worker
        resources:
          limits:
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: store-worker
